<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #fff; color: #1f2328; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    #title { margin: 0 0 12px; color: #59636e; overflow-wrap: anywhere; }
    button { width: 100%; padding: 9px; border: 0; border-radius: 6px; background: #cf222e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { background: #8c959f; cursor: default; }
    progress { width: 100%; margin-top: 10px; }
    #status { margin: 8px 0 0; overflow-wrap: anywhere; }
    .error { color: #cf222e; }
    .done { color: #1a7f37; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f2328; color: #e6edf3; }
      #title { color: #9198a1; }
    }
  </style>
</head>
<body>
  <h1>YouTube Audio Download</h1>
  <p id="title">Loading…</p>
  <button id="download" disabled>Download audio</button>
  <progress id="bar" max="100" hidden></progress>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
